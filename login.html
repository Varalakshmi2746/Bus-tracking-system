<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Login - Smart Bus Tracking</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <header>
        <div class="nav-container">
            <a href="dashboard.html" class="logo">🚍 SmartBus Transit</a>
            <ul class="nav-links">
                <li><a href="login.html" class="active">Login</a></li>
                <li><a href="signup.html">Signup</a></li>
            </ul>
        </div>
    </header>

    <div class="auth-wrapper">
        <div class="auth-card">
            <h1>Welcome Back 🚍</h1>
            <p class="subtitle">Sign in to track buses or transmit GPS</p>

            <form id="loginForm" onsubmit="handleLogin(event)">
                <div class="form-group">
                    <label for="username">Username / Email</label>
                    <input type="text" id="username" class="form-control" placeholder="e.g. passenger" required autofocus>
                </div>

                <div class="form-group">
                    <label for="password">Password</label>
                    <input type="password" id="password" class="form-control" placeholder="••••••••" required>
                </div>

                <div class="form-group">
                    <label for="role">User Role</label>
                    <select id="role" class="form-control">
                        <option value="passenger">Passenger (View Live Map)</option>
                        <option value="driver">Bus Driver (GPS Transmitter)</option>
                        <option value="admin">Transport Admin (Dashboard)</option>
                    </select>
                </div>

                <button type="submit" class="btn btn-primary">Sign In</button>
            </form>

            <div class="demo-credentials">
                <strong>💡 Quick Demo Logins (Click to autofill):</strong><br>
                <button type="button" onclick="quickFill('passenger', '1234', 'passenger')" class="btn btn-outline" style="margin-top:6px; padding:4px 8px; font-size:0.8rem; width:auto;">Passenger</button>
                <button type="button" onclick="quickFill('driver', '1234', 'driver')" class="btn btn-outline" style="margin-top:6px; padding:4px 8px; font-size:0.8rem; width:auto;">Driver</button>
                <button type="button" onclick="quickFill('admin', '1234', 'admin')" class="btn btn-outline" style="margin-top:6px; padding:4px 8px; font-size:0.8rem; width:auto;">Admin</button>
            </div>

            <p style="margin-top: 1.5rem; font-size: 0.9rem; color: var(--text-muted);">
                Don't have an account? <a href="signup.html" style="color: var(--primary); font-weight: 600; text-decoration: none;">Create Account</a>
            </p>
        </div>
    </div>

    <footer>
        &copy; 2026 Smart Bus Tracking System. Real-time GPS Telemetry & Public Transit.
    </footer>

    <script>
        function quickFill(user, pass, role) {
            document.getElementById('username').value = user;
            document.getElementById('password').value = pass;
            document.getElementById('role').value = role;
        }

        function handleLogin(e) {
            e.preventDefault();
            const username = document.getElementById('username').value.trim();
            const role = document.getElementById('role').value;

            // Save user session in localStorage
            localStorage.setItem('bus_user', JSON.stringify({
                username: username,
                role: role,
                loginTime: new Date().toISOString()
            }));

            // Redirect based on role
            if (role === 'driver') {
                window.location.href = 'gps.html';
            } else if (role === 'passenger') {
                window.location.href = 'map.html';
            } else {
                window.location.href = 'dashboard.html';
            }
        }
    </script>
</body>
</html>
